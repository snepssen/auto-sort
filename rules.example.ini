; auto-sort rules
;
; Tried in file order, first match wins. Nothing below a matching rule is
; considered, so the specific rules come first and the catch-alls come last.
;
; Downloads is treated as a funnel: somewhere files arrive on their way
; elsewhere, not somewhere they live. Every kind has a destination, and the
; catch-alls at the end mean nothing is kept back -- a funnel that holds on
; to what it did not recognise is a funnel that fills straight back up.
;
; Everything goes to the folders this machine already has. Pictures, Movies,
; Music and Documents sit empty on most computers while everything piles up
; in Downloads; a second set of media folders beside them would be one more
; mess with a tidier name.
;
; This file is yours. Everything the tray and the log page can change lives
; in the state database instead, so your comments are never eaten by a
; program rewriting the file. auto-sort writes here for one thing only: a
; category it has learnt from documents that were waiting for one, added
; above the catch-alls with a note saying so, every other line untouched and
; the file as it was kept beside it. Delete one and it stays deleted;
; `learn = off` below stops even that.
;
; Check it without running anything:   auto-sort check-rules
; See what it would do:                auto-sort sort ~/Downloads
; Ask why one file went where it did:  auto-sort explain FILE --rules RULES

[settings]
; `yes` shows where everything would go and never moves anything. Off by
; default, because a sorter that only ever proposes is one nobody keeps --
; but the first sort of a folder, and the first under rules you have
; edited, is still shown as a preview first, on the log page, and waits:
dry_run        = no

; How long that preview waits for you before sorting starts by itself.
; Pause from the tray or the page and it waits for as long as you like;
; `never` always waits for Resume. Every move is in the ledger, and
; `auto-sort undo all` -- or the log page -- puts things back.
preview_wait   = 15m

; What to do with a file no rule claimed. `leave` is the default because a
; file in the wrong folder is worse than an unsorted one: it is lost *and*
; you have stopped watching. `gather` collects them into unsorted_into.
unsorted       = leave
unsorted_into  = ~/Unsorted

; Never overwrite. `suffix` adds " (2)"; `skip` leaves the file where it is.
on_collision   = suffix

; How sure a rule has to be. Every fact carries a confidence: something read
; out of a header is `certain`, a tag is `strong`, a distinctive filename
; pattern is `likely` (0.70), and a bare keyword in a filename is `weak`
; (0.45). At 0.6 the first three count and the last does not. A rule that
; wants to act on weaker evidence than that says so for itself, with its own
; `min_confidence`, rather than this one being lowered for everybody.
min_confidence = 0.6

; What the background sorter does about files it already filed that could
; now be placed better: out of a holding folder once enough files have
; arrived for a pattern to show, or into a category that a changed rules
; file or an updated reader now finds for them. `apply` does it, `report`
; mentions it in the log, `off` never looks. Nothing here is lost either
; way: it is an ordinary move, in the ledger, and `auto-sort undo` reverses
; it like any other. A file you moved yourself is never touched.
regroup = apply

; Whether a category is added here by itself once enough documents waiting
; in a holding folder turn out to be headed the same way -- three invoices
; in Documents/PDF make an Invoice folder, and the invoices move into it.
; Only documents that are waiting count: nothing is taken from a category
; it already has. `apply` adds it, `report` says so in the log and leaves
; `auto-sort adopt --apply` to you, `off` never looks.
learn = apply

; Reading pages that were scanned rather than typed. `auto` means "if an OCR
; program is installed", which for most people means "no" until they install
; one -- the install is the switch. `off` is for somebody who has tesseract
; for other reasons and does not want seconds of processor time spent on each
; page. Nothing is ever downloaded and no page ever leaves this machine.
ocr = auto

; Where those programs run. `auto` gives each installed one a process of its
; own, started the first time a file needs it and stopped again when it has
; been idle for a couple of minutes -- so a folder that never needs one never
; pays for it. `inline` runs them inside the worker that identified the file,
; which is one process fewer and one slow page away from that worker doing
; nothing else. `off` runs no external program at all.
tools = auto

; A file must be this many seconds unchanged before it is touched, so that
; half-finished downloads are left alone.
settle_seconds = 3
poll_seconds   = 5
preserve_dates = yes

[watch]
folders = ~/Downloads
ignore  = *.part, *.crdownload, *.download, ~$*, .DS_Store, Thumbs.db
depth   = 3

; ---------------------------------------------------------------------------
; Pictures
; ---------------------------------------------------------------------------

[rule: screenshots]
when = kind = image and capture = screenshot
into = ~/Pictures/Screenshots/{happened:%Y-%m}

[rule: phone and messaging pictures]
when = kind = image and looks_like = phone-export
into = ~/Pictures/Received/{added:%Y-%m}

[rule: camera photos]
when = kind = image and camera is set
into = ~/Pictures/{taken:%Y}/{taken:%Y-%m-%d} {camera}

; ---------------------------------------------------------------------------
; Video
; ---------------------------------------------------------------------------

[rule: episodes]
when = kind = video and episode is set
into = ~/Videos/Series/{title}/Season {season|1}

[rule: films]
when = kind = video and release_year is set and duration > 70m
into = ~/Videos/Films

[rule: screen recordings]
when = kind = video and capture = screen-recording
into = ~/Videos/Recordings/{happened:%Y-%m}

; `{added}` rather than `{happened}`, and the difference matters. `happened`
; is the best date available: a capture date from EXIF, or a date parsed out
; of the filename, or -- failing both -- when the file arrived here, which is
; a *weak* inference and will not clear the 0.6 floor above. A phone clip
; carries no capture date, so a rule filing one by `{happened}` silently
; never fires. `added` is what this bucket actually means, and it is certain.
[rule: phone clips]
when = kind = video and aspect < 1 and duration < 3m
into = ~/Videos/Clips/{added:%Y-%m}

; ---------------------------------------------------------------------------
; Audio
; ---------------------------------------------------------------------------

; Needs both tags. Without them the destination cannot be filled, the rule
; declines, and the file falls through to `loose audio` below -- which is how
; these two rules hand work to each other without either naming the other.
[rule: tagged music]
when = kind = audio and artist is set and album is set
into = ~/Music/{artist}/{album}
as   = {track:02} {song_title}.{ext}

[rule: sample packs]
when = kind = audio and duration < 5s
into = ~/Music/Samples/{sample_type|misc}

[rule: voice recordings]
when = kind = audio and mono = yes and artist is unset and duration < 30m
into = ~/Music/Voice/{added:%Y-%m}

; ---------------------------------------------------------------------------
; Documents
; ---------------------------------------------------------------------------

; A folder named only by how the file was made is a waiting room: a scanned
; invoice that OCR has read moves on to Invoice like any other.
[rule: scanned paperwork]
when = kind = document and capture = scan
into = ~/Documents/Scans/{happened:%Y}
holding = yes

; Categories the documents chose for themselves. There is no list of document
; types in this program and no language it prefers: `auto-sort propose` counts
; the words that turn up at the top of your own documents, and in their
; filenames, and writes the ones that recur into a rule like the two below.
;
; A word in three or more of your files is a category. A word in nearly all of
; them is your own letterhead -- your name, your town, your bank -- and
; describes the pile rather than dividing it, so it is left out. The earliest
; such word on a page wins, which is why a kind of document usually beats the
; town it was posted from.
;
; They are commented out here because the words belong to your folder rather
; than to this file. These are what a German household's came out as; yours
; will be in whatever language your post arrives in.
;
; [rule: what the page calls itself]
; when    = heading is set
; extract = heading re (?P<group>Rechnung|Steuerbescheid|Mietvertrag)
; into    = ~/Documents/{group}
;
; [rule: what these files are called]
; when    = stem is set
; extract = stem re (?P<group>Rechnung|Steuerbescheid|Mietvertrag)
; into    = ~/Documents/{group}

; Folders whose contents only work together -- a LaTeX document with its
; class file, a code repository, a music session with its audio. Kept whole
; and filed as one thing, because moving part of a build breaks the rest of
; it. Decided by what is inside the folder, never by what it is called.
[rule: projects]
when = project is set
into = ~/Documents/Projects/{project}

; An encrypted PDF that could not be read -- a password that is not known,
; or a lock this program does not open -- has nothing inside it to go on, so
; nothing above claims it except by its name. It waits apart, by the day it
; arrived, and moves on by itself once it can be read.
[rule: encrypted PDFs]
when = format = pdf and (needs_password is set or encryption_unread is set)
into = ~/Documents/{ext:upper}/Encrypted/{added:%Y-%m-%d}
holding = yes

; ---------------------------------------------------------------------------
; Everything else
; ---------------------------------------------------------------------------

; Eleven years of Firefox installers in one folder is the case this tool
; exists for, so they are filed by what they are rather than by the month
; they were downloaded. The product name is not a list anywhere in the
; program: it is whatever precedes the version number in the file's own
; name, which is how installers have been named since installers existed.
[rule: installers by product]
when = kind in app, disk-image and product is set
into = ~/Documents/Installers/{product}

; The ones whose names admit nothing. Dated, because an undated holding
; folder becomes the problem it was meant to solve.
[rule: installers]
when = kind in app, disk-image
into = ~/Documents/Installers/{added:%Y-%m}
holding = yes

[rule: big archives]
when = kind = archive and size > 50mb
into = ~/Documents/Archives

[rule: 3d models]
when = kind = model3d
into = ~/Documents/3D/{stem}

[rule: subtitles on their own]
when = kind = subtitle and bundle is unset
into = ~/Videos/Subtitles

; Junk the operating system leaves behind. Matched before the catch-alls so
; that nothing below has to mention it, and left in place rather than moved:
; deleting is not something this tool does, and gathering it achieves
; nothing.
[rule: os litter]
when = looks_like = os-litter
mode = leave

; ---------------------------------------------------------------------------
; Origin-based routing
;
; `origin` is the sharpest provenance fact: it names the channel a file
; arrived through rather than the kind of thing it is.  Rules here sit
; between the kind-specific sections above and the catch-alls below, so
; they claim only what slipped past the more specific rules while still
; landing somewhere better than the dated holding buckets.
;
; Where a file came from says nothing about what it is, so every rule here
; is marked `holding`: an invoice that arrived by email waits with the other
; attachments until enough invoices show up for a folder of their own, and
; then moves into it by itself.
; ---------------------------------------------------------------------------

; Email attachments that made it past the kind-specific rules above.
; The kind-specific rules (camera photos, tagged music, episodes …) still
; fire first, so this only catches things like a loose PDF or an image
; without camera metadata that arrived as an attachment.
[rule: email attachments -- documents]
when = origin = email and kind = document
into = ~/Documents/From Email/{added:%Y-%m}
holding = yes

[rule: email attachments -- images]
when = origin = email and kind = image
into = ~/Pictures/From Email/{added:%Y-%m}
holding = yes

[rule: email attachments]
when = origin = email
into = ~/Documents/From Email/{added:%Y-%m}
holding = yes

; Files received through a messaging app. Pictures and clips sent over
; Messages, WhatsApp, Telegram, Slack, Discord, or Teams end up here.
[rule: message media -- images]
when = origin = message and kind = image
into = ~/Pictures/From Messages/{added:%Y-%m}
holding = yes

[rule: message media -- video]
when = origin = message and kind = video
into = ~/Videos/From Messages/{added:%Y-%m}
holding = yes

[rule: message files]
when = origin = message
into = ~/Documents/From Messages/{added:%Y-%m}
holding = yes

; Torrent downloads that the video rules above did not claim. Held rather
; than scattered, because a torrent is often a bundle that arrives in
; pieces and the pieces belong together until you decide otherwise.
[rule: torrent downloads]
when = origin = torrent
into = ~/Documents/From Torrents/{kind}/{added:%Y-%m}
holding = yes

; Files that landed in the watch folder via a cloud sync client. Treated
; as a holding bucket: they are usually on their way somewhere specific,
; and the background sorter moves them on once a pattern is clear.
[rule: cloud-synced files]
when = origin = cloud
into = ~/Documents/From Cloud/{added:%Y-%m}
holding = yes

; AirDrop can deliver anything -- sort images straight to Pictures, then
; hold everything else by kind in a dated folder for a closer look.
[rule: airdrop images]
when = origin = airdrop and kind = image
into = ~/Pictures/From AirDrop/{added:%Y-%m}
holding = yes

[rule: airdrop files]
when = origin = airdrop
into = ~/Documents/From AirDrop/{kind}/{added:%Y-%m}
holding = yes

; ---------------------------------------------------------------------------
; By type alone
;
; What is left of each kind, in a folder named only by what kind of file it
; is -- which says nothing about what it is about, so these are marked
; `holding`: waiting rooms. When enough of them turn out to share a heading
; or a name, the background sorter moves them into a folder of their own.
; They sit below the routing by origin, so that an attachment still lands
; with the other attachments first.
; ---------------------------------------------------------------------------

[rule: loose images]
when = kind = image and not looks_like = os-litter
into = ~/Pictures/Loose/{format:upper}
holding = yes

[rule: loose video]
when = kind = video
into = ~/Videos/Loose
holding = yes

[rule: loose audio]
when = kind = audio
into = ~/Music/Loose/{format:upper}
holding = yes

[rule: documents]
when = kind = document and not looks_like = os-litter
into = ~/Documents/{ext:upper}
holding = yes

; ---------------------------------------------------------------------------
; The catch-alls. Everything above is a better answer than these; these are
; what stops the funnel keeping anything back. They are marked
; `holding = yes`, which means a file one of them placed can be promoted out
; of it later: when more files arrive and a pattern becomes visible,
; `auto-sort regroup` moves what is already sitting here into the new
; structure, rather than making you drag it all back into Downloads. Dated, because an undated
; holding folder becomes the same problem it was meant to solve.
; ---------------------------------------------------------------------------

[rule: remaining images]
when = kind = image
into = ~/Pictures/Unfiled/{added:%Y-%m}
holding = yes

[rule: remaining video]
when = kind = video
into = ~/Videos/Unfiled/{added:%Y-%m}
holding = yes

[rule: remaining audio]
when = kind = audio
into = ~/Music/Unfiled/{added:%Y-%m}
holding = yes

[rule: remaining documents]
when = kind = document
into = ~/Documents/Unfiled/{added:%Y-%m}
holding = yes

[rule: remaining archives]
when = kind = archive
into = ~/Documents/Archives/{added:%Y-%m}
holding = yes

[rule: remaining code]
when = kind = code
into = ~/Documents/Code/{added:%Y-%m}
holding = yes

[rule: remaining fonts]
when = kind = font
into = ~/Documents/Fonts/{added:%Y-%m}
holding = yes

[rule: remaining data]
when = kind = data
into = ~/Documents/Data/{added:%Y-%m}
holding = yes

; Anything at all that reached here, which should be very little. It still
; leaves the funnel: a dated folder somebody can look through beats a
; Downloads folder nobody ever will.
[rule: anything left]
when = name is set
into = ~/Documents/Unsorted/{added:%Y-%m}
holding = yes
